<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.svg"><meta name="theme-color" content="#0b6b5d"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Học Anh-Toán">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f7f7;color:#123}
header{background:linear-gradient(135deg,#0b6b5d,#0a4f6e);color:#fff;padding:18px 16px}
header h1{margin:0;font-size:22px}header p{margin:6px 0 0;opacity:.92;font-size:14px}
.wrap{max-width:980px;margin:0 auto;padding:14px}
nav{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
nav button{border:1px solid #cfe3de;background:#fff;border-radius:999px;padding:9px 14px;font-size:15px;cursor:pointer}
nav button.on{background:#0b6b5d;color:#fff;border-color:#0b6b5d}
.card{background:#fff;border:1px solid #e2ecea;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.word{font-size:20px;font-weight:700}.ipa{color:#567;font-size:14px}.mean{font-size:16px;margin:4px 0}.ex{color:#345;font-size:14px}
.btn{background:#0b6b5d;color:#fff;border:0;border-radius:10px;padding:9px 13px;font-size:15px;cursor:pointer;margin:4px 4px 0 0}
.btn2{background:#eef5f3;color:#0b4f45;border:1px solid #cfe3de;border-radius:10px;padding:8px 12px;font-size:15px;cursor:pointer;margin:4px 4px 0 0}
.opt{display:block;width:100%;text-align:left;margin:7px 0;padding:11px;border-radius:10px;border:1px solid #d8e6e2;background:#fff;font-size:16px;cursor:pointer}
.opt.right{background:#dff5e6;border-color:#3a9d6e}.opt.wrong{background:#ffe3e0;border-color:#d66}
input,select{font-size:16px;padding:10px;border-radius:10px;border:1px solid #cbdeda;width:100%}
.flash{font-size:28px;text-align:center;padding:28px 10px;cursor:pointer}
.small{font-size:13px;color:#567}.chat{height:260px;overflow:auto;border:1px solid #e2ecea;border-radius:12px;padding:10px;background:#fbfdfd}
.msg{margin:8px 0}.me{text-align:right}.bubble{display:inline-block;padding:9px 12px;border-radius:14px;background:#eef5f3;max-width:85%}.me .bubble{background:#0b6b5d;color:#fff}
footer{text-align:center;color:#678;font-size:13px;padding:18px}
</style></head><body>
<header><h1>🇬🇧 Học tiếng Anh giao tiếp và Toán học</h1><p>Mức A1 cho người mới bắt đầu • Dễ học, dễ nhớ, áp dụng được • XP: <b id="xp">0</b> • Đã thuộc: <b id="known">0</b> từ</p><p><button id="installBtn" class="btn" style="background:#fff;color:#0b6b5d" hidden>📲 Tải app về điện thoại</button></p></header>
<div class="wrap">
<nav id="nav"></nav>
<main id="main"></main>
</div>
<footer>Học tiếng Anh giao tiếp và Toán học — bản website dùng chung. Tiến độ lưu trên trình duyệt của bạn.<br><b>Bản quyền thuộc Y Đôi Bol - SĐT: 0812144546</b></footer>
<script>
const VOCAB=[
["hello","/həˈloʊ/","xin chào","Hello, teacher!","Giao tiếp"],["thank you","/θæŋk juː/","cảm ơn","Thank you very much.","Giao tiếp"],["please","/pliːz/","làm ơn","Please open your book.","Giao tiếp"],["good morning","/ɡʊd ˈmɔːrnɪŋ/","chào buổi sáng","Good morning, class!","Giao tiếp"],["how are you","/haʊ ɑːr juː/","bạn khỏe không","How are you today?","Giao tiếp"],["I am fine","/aɪ æm faɪn/","tôi khỏe","I am fine, thanks.","Giao tiếp"],["teacher","/ˈtiːtʃər/","giáo viên","She is a math teacher.","Giao tiếp"],["student","/ˈstuːdnt/","học sinh","The student is smart.","Giao tiếp"],["book","/bʊk/","sách","This book is new.","Giao tiếp"],["school","/skuːl/","trường học","My school is big.","Giao tiếp"],
["number","/ˈnʌmbər/","số","Five is a number.","Toán"],["plus","/plʌs/","cộng","Two plus three equals five.","Toán"],["minus","/ˈmaɪnəs/","trừ","Nine minus five is four.","Toán"],["times","/taɪmz/","nhân","Six times seven is forty-two.","Toán"],["divided by","/dɪˈvaɪdɪd baɪ/","chia cho","Twelve divided by four is three.","Toán"],["equals","/ˈiːkwəlz/","bằng","Two plus two equals four.","Toán"],["greater than","/ˈɡreɪtər ðæn/","lớn hơn","Five is greater than three.","Toán"],["less than","/les ðæn/","nhỏ hơn","Two is less than five.","Toán"],["fraction","/ˈfrækʃn/","phân số","One half is a fraction.","Toán"],["percent","/pərˈsent/","phần trăm","Twenty-five percent is one fourth.","Toán"],
["triangle","/ˈtraɪæŋɡl/","tam giác","A triangle has three sides.","Hình học"],["square","/skwer/","hình vuông","A square has four equal sides.","Hình học"],["circle","/ˈsɜːrkl/","đường tròn","Draw a circle.","Hình học"],["angle","/ˈæŋɡl/","góc","A right angle is ninety degrees.","Hình học"],["line","/laɪn/","đường thẳng","Draw a line.","Hình học"],["point","/pɔɪnt/","điểm","Point A is here.","Hình học"],["parallel","/ˈpærəlel/","song song","These lines are parallel.","Hình học"],["perpendicular","/ˌpɜːrpənˈdɪkjələr/","vuông góc","The lines are perpendicular.","Hình học"],["radius","/ˈreɪdiəs/","bán kính","The radius is five.","Hình học"],["diameter","/daɪˈæmɪtər/","đường kính","The diameter is ten.","Hình học"],
["equation","/ɪˈkweɪʒn/","phương trình","Solve this equation.","Đại số"],["variable","/ˈveriəbl/","biến số","X is a variable.","Đại số"],["function","/ˈfʌŋkʃn/","hàm số","This function is simple.","Đại số"],["graph","/ɡræf/","đồ thị","Draw the graph.","Đại số"],["solution","/səˈluːʃn/","nghiệm, lời giải","The solution is three.","Đại số"],["square root","/skwer ruːt/","căn bậc hai","The square root of nine is three.","Đại số"],["power","/ˈpaʊər/","lũy thừa","Two to the power of three is eight.","Đại số"],["sequence","/ˈsiːkwəns/","dãy số","One, two, four is a sequence.","Đại số"],["probability","/ˌprɑːbəˈbɪləti/","xác suất","The probability is one half.","Xác suất"],["average","/ˈævərɪdʒ/","trung bình","The average is four.","Thống kê"],
["derivative","/dɪˈrɪvətɪv/","đạo hàm","Find the derivative.","Giải tích"],["integral","/ˈɪntɪɡrəl/","tích phân","This integral is one third.","Giải tích"],["limit","/ˈlɪmɪt/","giới hạn","The limit is two.","Giải tích"],["vector","/ˈvektər/","vectơ","A vector has direction.","Hình học"],["plane","/pleɪn/","mặt phẳng","Two planes are parallel.","Hình học"],["pyramid","/ˈpɪrəmɪd/","hình chóp","A pyramid has a square base.","Hình học"],["prism","/ˈprɪzəm/","hình lăng trụ","This prism is tall.","Hình học"],["sphere","/sfɪər/","hình cầu","A sphere is round.","Hình học"],["set","/set/","tập hợp","This set has three numbers.","Tập hợp"],["element","/ˈelɪmənt/","phần tử","Two is an element.","Tập hợp"]
];
const PATTERNS=[["I am + danh từ/tính từ","I am a teacher.","Tôi là giáo viên."],["I like + danh từ","I like math.","Tôi thích Toán."],["This is + danh từ","This is a triangle.","Đây là một tam giác."],["It is + tính từ","It is easy.","Nó dễ."],["We have + số + danh từ","We have three sides.","Chúng ta có ba cạnh."],["X equals Y","Two plus three equals five.","2 + 3 bằng 5."],["X is greater than Y","Five is greater than three.","5 lớn hơn 3."],["Please + động từ","Please open your book.","Hãy mở sách."],["Can you + động từ?","Can you help me?","Bạn giúp tôi được không?"],["I do not understand","I do not understand.","Tôi không hiểu."]];
const SYMBOLS=[["+","plus","cộng","3 + 4 = 7"],["−","minus","trừ","9 − 5 = 4"],["×","times","nhân","6 × 7 = 42"],["÷","divided by","chia","12 ÷ 4 = 3"],["=","equals","bằng","2 + 3 = 5"],["≠","is not equal to","khác","3 ≠ 4"],[">","is greater than","lớn hơn","5 > 3"],["<","is less than","nhỏ hơn","2 < 5"],["≥","is greater than or equal to","lớn hơn hoặc bằng","x ≥ 2"],["≤","is less than or equal to","nhỏ hơn hoặc bằng","x ≤ 5"],["√","square root of","căn bậc hai của","√9 = 3"],["π","pi","pi","π ≈ 3.14"],["%","percent","phần trăm","50%"],["∞","infinity","vô cực","x → ∞"],["∠","angle","góc","∠A = 90°"],["⊥","perpendicular to","vuông góc với","AB ⊥ CD"],["∥","parallel to","song song với","AB ∥ CD"],["△","triangle","tam giác","△ABC"],["∈","belongs to","thuộc","2 ∈ A"],["∅","empty set","tập rỗng","A = ∅"]];
const QUIZ=[["“Tam giác” tiếng Anh là gì?",["triangle","square","circle","angle"],0],["Two plus three equals…",["four","five","six","three"],1],["“Lớn hơn” tiếng Anh là…",["less than","greater than","equals","plus"],1],["The square root of nine is…",["two","three","nine","six"],1],["“Phương trình” tiếng Anh là…",["function","equation","graph","set"],1],["Five is ___ than three.",["less","greater","equal","small"],1],["“Giáo viên” tiếng Anh là…",["student","teacher","school","book"],1],["Twelve divided by four is…",["two","three","four","six"],1],["“Đồ thị” tiếng Anh là…",["graph","angle","radius","point"],0],["A right angle is ___ degrees.",["45","90","180","360"],1]];
let xp=+localStorage.getItem('xp')||0, known=new Set(JSON.parse(localStorage.getItem('known')||'[]')), tab='vocab', flashIdx=0, flashBack=false, quizIdx=0, quizScore=0;
function save(){localStorage.setItem('xp',xp);localStorage.setItem('known',JSON.stringify([...known]));document.getElementById('xp').textContent=xp;document.getElementById('known').textContent=known.size}
function speak(t,slow){try{let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=slow?0.55:0.82;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const TABS=[['vocab','📚 Từ vựng'],['flash','🃏 Flashcard'],['quiz','❓ Quiz'],['patterns','🧩 Mẫu câu'],['symbols','➕ Kí hiệu Toán'],['emma','💬 Nói với Emma'],['mental','🧮 Tính nhẩm']];
function renderNav(){document.getElementById('nav').innerHTML=TABS.map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';render()">${l}</button>`).join('')}
function render(){renderNav();save();let m=document.getElementById('main');
 if(tab==='vocab'){m.innerHTML=`<div class="card"><b>Từ vựng A1</b><div class="small">Bấm 🔊 để nghe. Bấm “Đã thuộc” để lưu tiến độ.</div></div><div class="grid">`+VOCAB.map((v,i)=>`<div class="card"><div class="word">${esc(v[0])}</div><div class="ipa">${esc(v[1])} • ${esc(v[4])}</div><div class="mean">${esc(v[2])}</div><div class="ex">${esc(v[3])}</div><button class="btn2" onclick="speak('${v[0].replace(/'/g,"")}')">🔊 Nghe</button><button class="btn2" onclick="speak('${v[3].replace(/'/g,"")}',true)">🐢 Chậm</button><button class="btn" onclick="markKnown(${i})">${known.has(i)?'✓ Đã thuộc':'Đã thuộc'}</button></div>`).join('')+`</div>`}
 else if(tab==='flash'){let v=VOCAB[flashIdx%VOCAB.length];m.innerHTML=`<div class="card flash" onclick="flashBack=!flashBack;render()">${flashBack?esc(v[2])+'<div class="small">'+esc(v[3])+'</div>':esc(v[0])+'<div class="small">'+esc(v[1])+' — bấm để lật thẻ</div>'}</div><button class="btn" onclick="speak('${v[0].replace(/'/g,"")}')">🔊 Nghe</button><button class="btn" onclick="markKnown(${flashIdx%VOCAB.length})">Đã thuộc</button><button class="btn2" onclick="flashIdx++;flashBack=false;render()">Thẻ tiếp →</button>`}
 else if(tab==='quiz'){if(quizIdx>=QUIZ.length){m.innerHTML=`<div class="card"><h3>Kết quả: ${quizScore}/${QUIZ.length}</h3><button class="btn" onclick="quizIdx=0;quizScore=0;render()">Làm lại</button></div>`}else{let q=QUIZ[quizIdx];m.innerHTML=`<div class="card"><div class="small">Câu ${quizIdx+1}/${QUIZ.length}</div><h3>${esc(q[0])}</h3>`+q[1].map((o,i)=>`<button class="opt" onclick="ansQuiz(${i})">${esc(o)}</button>`).join('')+`</div>`}}
 else if(tab==='patterns'){m.innerHTML=PATTERNS.map(p=>`<div class="card"><b>${esc(p[0])}</b><div class="ex">${esc(p[1])} — ${esc(p[2])}</div><button class="btn2" onclick="speak('${p[1].replace(/'/g,"")}')">🔊 Nghe</button></div>`).join('')}
 else if(tab==='symbols'){m.innerHTML=`<div class="grid">`+SYMBOLS.map(s=>`<div class="card"><div class="word">${esc(s[0])} <span class="ipa">${esc(s[1])}</span></div><div class="mean">${esc(s[2])}</div><div class="ex">${esc(s[3])}</div><button class="btn2" onclick="speak('${s[1].replace(/'/g,"")}')">🔊 Nghe</button></div>`).join('')+`</div>`}
 else if(tab==='emma'){m.innerHTML=`<div class="card"><b>💬 Nói với Emma</b><div class="small">Gõ tiếng Anh đơn giản, Emma trả lời ngắn. Có micro thì bấm 🎙️ (Chrome/Safari mới).</div><div class="chat" id="chat"><div class="msg"><span class="bubble">Hello! I am Emma. How are you?</span></div></div><div style="display:flex;gap:8px;margin-top:8px"><input id="chatIn" placeholder="I am fine" onkeydown="if(event.key==='Enter')sendChat()"><button class="btn" onclick="sendChat()">Gửi</button><button class="btn2" onclick="micChat()">🎙️</button></div></div>`}
 else if(tab==='mental'){newMental()}
}
function markKnown(i){if(!known.has(i)){known.add(i);xp+=10}save();render()}
function ansQuiz(i){let q=QUIZ[quizIdx];if(i===q[2]){quizScore++;xp+=3;alert('Đúng rồi!')}else alert('Chưa đúng. Đáp án đúng: '+q[1][q[2]]);quizIdx++;render()}
function sendChat(){let inp=document.getElementById('chatIn'),t=inp.value.trim();if(!t)return;let c=document.getElementById('chat');c.innerHTML+=`<div class="msg me"><span class="bubble">${esc(t)}</span></div>`;inp.value='';let low=t.toLowerCase(),r='Good. Please say more.';if(low.includes('fine')||low.includes('good'))r='Great! What is your name?';else if(low.includes('name'))r='Nice to meet you! Do you like math?';else if(low.includes('math'))r='Math is fun. Two plus three equals five.';else if(low.includes('hello')||low.includes('hi'))r='Hello! How are you today?';else if(low.includes('thank'))r='You are welcome!';setTimeout(()=>{c.innerHTML+=`<div class="msg"><span class="bubble">${r}</span></div>`;c.scrollTop=c.scrollHeight;speak(r);xp+=5;save()},300)}
function micChat(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Trình duyệt này chưa hỗ trợ micro. Hãy dùng Chrome mới hoặc gõ chữ.');return}let r=new SR();r.lang='en-US';r.onresult=e=>{document.getElementById('chatIn').value=e.results[0][0].transcript;sendChat()};r.onerror=()=>alert('Chưa có quyền dùng micro. Hãy cho phép micro trên trình duyệt.');r.start()}
let mentalAns=0;function newMental(){let a=2+Math.floor(Math.random()*20),b=2+Math.floor(Math.random()*20),ops=[['plus',a+b],['minus',a-b],['times',a*b]];let o=ops[Math.floor(Math.random()*3)];if(o[1]<0){o=['plus',a+b]}mentalAns=o[1];let opts=[...new Set([mentalAns,mentalAns+1,mentalAns-1,mentalAns+2])].sort(()=>Math.random()-.5);let say=`${a} ${o[0]} ${b} equals what?`;document.getElementById('main').innerHTML=`<div class="card"><b>🧮 Tính nhẩm nghe số</b><div class="small">Nghe phép tính rồi chọn kết quả.</div><button class="btn" onclick="speak('${say}')">🔊 Nghe phép tính</button>`+opts.map(x=>`<button class="opt" onclick="ansMental(${x})">${x}</button>`).join('')+`</div>`;setTimeout(()=>speak(say),200)}
function ansMental(x){if(x===mentalAns){xp+=3;alert('Đúng rồi!')}else alert('Chưa đúng. Kết quả là '+mentalAns);save();newMental()}
render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
let installPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;document.getElementById('installBtn').hidden=false});
document.getElementById('installBtn').addEventListener('click',async()=>{if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;document.getElementById('installBtn').hidden=true}else{alert('Trên điện thoại: mở trình duyệt Chrome/Safari, bấm menu ⋮ hoặc nút Chia sẻ, rồi chọn “Thêm vào màn hình chính” / “Cài đặt ứng dụng”.')}});
window.addEventListener('appinstalled',()=>{document.getElementById('installBtn').hidden=true});
</script></body></html>
